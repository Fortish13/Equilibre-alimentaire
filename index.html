<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Équilibre alimentaire du foyer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#23664A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root {
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --surface-2: #E8EEEB;
  --ink: #15231E;
  --ink-2: #4D6058;
  --line: #D2DCD7;
  --accent: #23664A;
  --accent-ink: #FFFFFF;
  --accent-2: #DCEEE5;
  --ok: #23664A; --ok-bg: #E1F0E8;
  --proche: #8F6200; --proche-bg: #FAEFD3;
  --bas: #B42318; --bas-bg: #FBE6E3;
  --exces: #6E3B8C; --exces-bg: #EEE5F4;
  --na: #6B7A74; --na-bg: #EEF1EF;
  --focus: #1F5FBF;
  --font: "Avenir Next", "Segoe UI", "Helvetica Neue", Ubuntu, Roboto, system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1714; --surface: #16211D; --surface-2: #1C2A25; --ink: #E3EBE7; --ink-2: #A2B4AC; --line: #2B3C36;
    --accent: #6CC39A; --accent-ink: #0F1714; --accent-2: #1D3A2E;
    --ok: #6CC39A; --ok-bg: #173327; --proche: #E8B54D; --proche-bg: #382C11; --bas: #F2918A; --bas-bg: #3C1E1B;
    --exces: #CDA8EA; --exces-bg: #2D2140; --na: #93A39C; --na-bg: #1E2925; --focus: #8AB4F8;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
h2 { font-size: 1.25rem; font-weight: 650; }
h3 { font-size: 1.02rem; font-weight: 650; }
p { margin: 0 0 .6em; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muet { color: var(--ink-2); }
.petit { font-size: .86rem; }
[hidden] { display: none !important; }

/* ---------------------------------------------------------------- en-tête */
.entete { background: var(--surface); }
.entete-haut { max-width: 1280px; margin: 0 auto; padding: 14px 20px 6px; display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.titre h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.01em; }
.sous-titre { margin: 2px 0 0; color: var(--ink-2); font-size: .9rem; }
.foyer-resume { display: flex; gap: 8px; flex-wrap: wrap; }
.puce-personne { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .84rem; background: var(--surface-2); }
.puce-personne b { font-weight: 650; }
.onglets { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 max(12px, calc((100% - 1280px) / 2 + 12px)); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.onglets button { border: 0; background: none; padding: 10px 12px 9px; border-bottom: 3px solid transparent; color: var(--ink-2); cursor: pointer; white-space: nowrap; font-weight: 550; }
.onglets button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.onglets button:hover { color: var(--ink); }

main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; }
.section { margin-bottom: 26px; }
.section > h2 { margin-bottom: 10px; }
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.rang { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.espace { flex: 1 1 auto; }

/* ---------------------------------------------------------------- boutons et champs */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-weight: 550; }
.btn:hover { border-color: var(--ink-2); }
.btn-principal { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-principal:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-lien { border: 0; background: none; color: var(--accent); padding: 2px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.btn-mini { padding: 3px 8px; font-size: .82rem; border-radius: 6px; }
.champ { display: flex; flex-direction: column; gap: 3px; font-size: .86rem; color: var(--ink-2); }
.champ input, .champ select { color: var(--ink); }
input[type="number"], input[type="text"], input[type="search"], input[type="time"], input[type="password"], input:not([type]), select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 8px; min-width: 0; }
.btn[aria-pressed="true"] { background: var(--accent-2); border-color: var(--accent); }
input[type="number"] { width: 6.5em; }
.segmente { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.segmente button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.segmente button:last-child { border-right: 0; }
.segmente button[aria-pressed="true"] { background: var(--accent-2); color: var(--ink); font-weight: 650; }

/* ---------------------------------------------------------------- prochain repas (07/11/2026) */
.bandeau-repas { max-width: 1280px; margin: 0 auto; padding: 0 20px 8px; }
.bandeau-btn { width: 100%; text-align: left; border: 1px solid var(--accent); background: var(--accent-2); color: var(--ink); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-size: .9rem; line-height: 1.35; }
.bandeau-btn:hover { filter: brightness(.98); }
.bandeau-lib { color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: .72rem; letter-spacing: .04em; margin-right: 4px; }
.prochain { border: 2px solid var(--accent); padding: 16px 18px; margin-bottom: 18px; }
.prochain-tete { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.prochain-titre { flex: 1 1 320px; min-width: 0; }
.surtitre { margin: 0 0 2px; color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: .74rem; letter-spacing: .05em; }
.prochain h2 { font-size: 1.05rem; color: var(--ink-2); font-weight: 600; }
.nom-recette.grand { font-size: 1.45rem; font-weight: 750; letter-spacing: -0.01em; margin: 4px 0 6px; display: block; }
.horaire { margin: 0 0 4px; font-size: .92rem; }
.prochain-actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; flex: 0 1 260px; min-width: 0; }
.prochain-actions .btn-principal { font-size: 1.02rem; padding: 10px 16px; }
.prochain-actions select { max-width: 100%; }
.prochain-corps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.prochain-corps h3 { margin-bottom: 6px; }
.table-quantites td { padding: 5px 6px; }
.table-quantites td.petit { font-size: .78rem; }
@media (max-width: 760px) { .prochain-corps { grid-template-columns: minmax(0, 1fr); } .nom-recette.grand { font-size: 1.25rem; } .prochain-actions { flex-basis: 100%; } }
@media (max-width: 560px) { .sous-titre, .foyer-resume { display: none; } .entete-haut { padding-top: 10px; } .titre h1 { font-size: 1.2rem; } .bandeau-repas { padding: 0 12px 8px; } main { padding: 14px 12px 50px; } .prochain { padding: 14px 12px; } }
.ensuite { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.ensuite-item { display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; min-width: 0; }
.ensuite-item:hover { border-color: var(--ink-2); }
.ensuite-nom { font-weight: 650; line-height: 1.25; }
.cout-jour { font-size: .72rem; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.prep { border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
.prep::before { content: "⏱ "; }
.prep.prep-trop { border-color: var(--bas); color: var(--bas); background: var(--bas-bg); font-weight: 650; }
.recette .appareils { color: var(--ink-2); margin-top: 2px; }
.recette .appareils::before { content: "🍳 "; }
/* synchronisation */
.sync-tag { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 999px; font-size: .74rem; font-weight: 600; padding: 1px 8px; vertical-align: 4px; cursor: pointer; letter-spacing: 0; }
.sync-tag.ok { color: var(--ok); border-color: var(--ok); }
.sync-tag.err { color: var(--proche); border-color: var(--proche); }
.lien-boite { margin-top: 10px; }
.sync-qr { display: inline-block; background: #fff; padding: 8px; border-radius: 8px; margin: 6px 0; }
.sync-qr svg { display: block; width: 240px; height: 240px; max-width: 70vw; max-height: 70vw; }
.lien-recu { border: 2px solid var(--accent); margin-bottom: 16px; }
.lien-recu h2 { margin-bottom: 6px; }
.aide-sync { margin-top: 12px; font-size: .9rem; }
.aide-sync summary { cursor: pointer; font-weight: 600; }
.aide-sync ol { padding-left: 1.3em; }
.aide-sync li { margin-bottom: 5px; }
.attention-txt { color: var(--proche); font-weight: 600; }
.ok-txt { color: var(--ok); font-weight: 600; }

/* ---------------------------------------------------------------- semaine */
.barre-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.kpi .val { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .lib { color: var(--ink-2); font-size: .85rem; }
.semaine { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.jour { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.jour h3 { font-size: .95rem; padding: 2px 2px 4px; border-bottom: 1px solid var(--line); }
.creneau { display: flex; flex-direction: column; gap: 3px; min-height: 136px; padding: 4px 2px; border-bottom: 1px dashed var(--line); }
.creneau:last-child { border-bottom: 0; }
.creneau .moment { font-size: .76rem; color: var(--ink-2); display: flex; justify-content: space-between; gap: 4px; align-items: center; }
.nom-recette { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; font-size: .86rem; line-height: 1.25; color: var(--ink); cursor: pointer; }
.nom-recette:hover { text-decoration: underline; text-underline-offset: 2px; }
.creneau select.changer { font-size: .76rem; padding: 2px 4px; max-width: 100%; margin-left: auto; color: var(--ink-2); }
.creneau .pied { display: flex; gap: 6px; align-items: center; font-size: .76rem; color: var(--ink-2); flex-wrap: wrap; }
.verrou { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 26px; height: 22px; padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.verrou svg { width: 13px; height: 13px; }
.verrou { color: var(--ink-2); }
.verrou[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.absent { font-size: .74rem; color: var(--ink-2); font-style: italic; }
@media (max-width: 1100px) { .semaine { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 760px) { .semaine { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .semaine { grid-template-columns: minmax(0, 1fr); } .creneau { min-height: 0; } }

.attention { display: grid; gap: 8px; }
.alerte { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
.alerte .marque { width: 6px; align-self: stretch; border-radius: 3px; background: var(--st, var(--na)); flex: 0 0 auto; }
.alerte p { margin: 0; }

/* ---------------------------------------------------------------- tuiles nutriments */
.st-ok { --st: var(--ok); --st-bg: var(--ok-bg); }
.st-proche { --st: var(--proche); --st-bg: var(--proche-bg); }
.st-bas { --st: var(--bas); --st-bg: var(--bas-bg); }
.st-exces, .st-lss { --st: var(--exces); --st-bg: var(--exces-bg); }
.st-na { --st: var(--na); --st-bg: var(--na-bg); }
.tableau-elements { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.groupe-titre { font-size: .9rem; color: var(--ink-2); margin: 12px 0 6px; font-weight: 600; }
.tuile { position: relative; width: 96px; min-height: 100px; border: 2px solid var(--st); background: var(--st-bg); border-radius: 9px; padding: 6px 8px 9px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; text-align: left; overflow: hidden; }
.tuile[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--st); }
.tuile .z { font-size: .7rem; color: var(--ink-2); line-height: 1; min-height: .7rem; }
.tuile .sym { font-size: 1.6rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.05; }
.tuile .sym.long { font-size: 1.05rem; }
.tuile .nom { font-size: .7rem; color: var(--ink-2); line-height: 1.15; }
.tuile .pct { font-size: .95rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--st); }
.tuile .jauge { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--st); opacity: .9; }
.bilan-grille { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .bilan-grille { grid-template-columns: minmax(0, 1fr); } }
.detail h3 { margin-bottom: 6px; }
.barre { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.barre > span { display: block; height: 100%; background: var(--accent); }
.contrib { display: grid; grid-template-columns: minmax(0, 1fr) 72px 110px; gap: 4px 10px; align-items: center; font-size: .88rem; }
.legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-2); margin: 4px 0 10px; }
.legende span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--st); margin-right: 5px; vertical-align: -1px; }

/* ---------------------------------------------------------------- tableaux */
.table-defile { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 650; color: var(--ink-2); font-size: .84rem; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.modifie td { background: var(--proche-bg); }
.pastille { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--st-bg); color: var(--st); border: 1px solid var(--st); white-space: nowrap; }

/* ---------------------------------------------------------------- recettes */
.filtres { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.recettes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.recette { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; }
.recette:hover { border-color: var(--ink-2); }
.recette h3 { font-size: .98rem; }
.mini-nutri { display: flex; gap: 10px; font-size: .8rem; color: var(--ink-2); flex-wrap: wrap; }
.mini-nutri b { color: var(--ink); font-weight: 650; }
.etiquette { display: inline-block; font-size: .74rem; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin-right: 4px; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(920px, 96vw); max-height: 92vh; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 20, 16, .45); }
.dlg-tete { position: sticky; top: 0; background: var(--surface); padding: 14px 18px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.dlg-corps { padding: 14px 18px 18px; overflow: auto; }
.etapes { padding-left: 1.3em; margin: 6px 0 12px; }
.etapes li { margin-bottom: 5px; }

/* ---------------------------------------------------------------- courses */
.rayon h3 { margin: 14px 0 6px; font-size: .95rem; }
.ligne-course { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 4px 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.ligne-course.coche { opacity: .5; }
.ligne-course.coche .nom-art { text-decoration: line-through; }
.ligne-course input { width: 20px; height: 20px; }
@media (max-width: 560px) { .ligne-course { grid-template-columns: 28px minmax(0, 1fr) auto; } .ligne-course .besoin { grid-column: 2 / 3; } }

/* ---------------------------------------------------------------- foyer */
.personnes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.formulaire { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; margin: 10px 0; }
.formulaire .large { grid-column: 1 / -1; }
.formulaire input, .formulaire select { width: 100%; }
.formulaire input[type="checkbox"] { width: auto; }
.case { display: inline-flex; align-items: center; gap: 6px; margin: 2px 16px 2px 0; color: var(--ink); font-size: .9rem; }
.presence { display: grid; grid-template-columns: 74px repeat(7, minmax(0, 1fr)); gap: 3px; font-size: .78rem; align-items: center; text-align: center; }
.presence .lib { text-align: left; color: var(--ink-2); }
.presence input { width: 18px; height: 18px; margin: 0 auto; display: block; }

/* ---------------------------------------------------------------- divers */
.voile { position: fixed; inset: 0; background: rgba(10, 20, 16, .35); display: flex; align-items: center; justify-content: center; z-index: 50; }
.voile-boite { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 24px; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 9px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; max-width: 92vw; }
.toast.visible { opacity: 1; }
.note { border-left: 4px solid var(--accent); background: var(--surface); padding: 10px 14px; border-radius: 0 9px 9px 0; margin: 10px 0; }
.carte .note { font-size: .86rem; padding: 8px 12px; background: var(--surface-2); }
.note.note-grave { border-left-color: var(--bas); background: var(--bas-bg); }
.liste-simple { margin: 4px 0 10px; padding-left: 1.2em; }
.liste-simple li { margin-bottom: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .entete .onglets, .barre-actions, .verrou, .btn, .filtres, .bandeau-repas, .sync-tag { display: none !important; }
  .entete { position: static; }
  body { background: #fff; }
  .jour, .carte, .kpi { break-inside: avoid; }
}

</style>
</head>
<body>
<header class="entete">
  <div class="entete-haut">
    <div class="titre">
      <h1>Équilibre alimentaire du foyer <button id="syncTag" class="sync-tag" type="button" hidden></button></h1>
      <p class="sous-titre" id="sousTitre"></p>
    </div>
    <div class="foyer-resume" id="foyerResume" aria-label="Besoins du foyer"></div>
  </div>
  <div class="bandeau-repas" id="bandeauRepas" hidden></div>
</header>
<nav class="onglets" role="tablist" aria-label="Sections">
    <button role="tab" data-onglet="aujourdhui" aria-selected="true">Prochain repas</button>
    <button role="tab" data-onglet="semaine" aria-selected="false">Semaine</button>
    <button role="tab" data-onglet="bilan" aria-selected="false">Bilan nutritionnel</button>
    <button role="tab" data-onglet="recettes" aria-selected="false">Recettes</button>
    <button role="tab" data-onglet="courses" aria-selected="false">Courses</button>
    <button role="tab" data-onglet="prix" aria-selected="false">Prix Carrefour</button>
    <button role="tab" data-onglet="foyer" aria-selected="false">Foyer</button>
    <button role="tab" data-onglet="methode" aria-selected="false">Méthode et sources</button>
</nav>
<main id="contenu"><p>Chargement…</p></main>
<div id="voile" class="voile" hidden><div class="voile-boite"><p id="voileTexte" style="margin:0">Calcul en cours…</p></div></div>
<dialog id="dlgRecette" aria-label="Recette"></dialog>

"u":1}],"placard":["herbes de Provence","paprika doux"],"dessert":"yaourt nature","etapes":["Couper les pommes de terre lavées (avec la peau) en cubes de 2 cm, les mélanger avec la moitié de l'huile, le sel et le paprika.","Air fryer 200 °C, 15 min, en secouant à mi-cuisson (en deux fournées si le panier fait moins de 5 L).","Ajouter les rondelles de courgettes surgelées bien égouttées et le reste de l'huile, 8 à 10 min de plus.","Casser un œuf dans chaque ramequin huilé, parsemer d'emmental ; 6 à 8 min à l'air fryer à 180 °C (blanc pris, jaune encore coulant). Dessert : yaourt nature."]},{"id":"R45","nom":"Pâtes complètes au brocoli et à l'emmental","moments":["midi","soir"],"prep":5,"cuisson":12,"appareils":["plaques","micro"],"lignes":[{"f":"patesCompl","q":90,"u":0},{"f":"brocoli","q":150,"u":0},{"f":"colza","q":8,"u":0},{"f":"emmental","q":18,"u":0},{"f":"sel","q":0.35,"u":0},{"f":"compote","q":100,"u":1}],"placard":["ail"],"dessert":"compote","etapes":["Cuire les pâtes.","Pendant ce temps, cuire le brocoli surgelé 6 à 8 min au micro-ondes (couvert, 2 cuillères à soupe d'eau), puis l'écraser grossièrement à la fourchette.","Mélanger pâtes, brocoli, huile, un peu d'ail et l'emmental. Dessert : compote."]},{"id":"R46","nom":"Semoule express aux pois chiches, courgettes et tomate, au micro-ondes","moments":["midi","soir"],"prep":5,"cuisson":10,"appareils":["micro"],"lignes":[{"f":"couscous","q":70,"u":0},{"f":"poisChiches","q":100,"u":0},{"f":"courgette","q":120,"u":0},{"f":"pulpeTomate","q":60,"u":0},{"f":"colza","q":8,"u":0},{"f":"sel","q":0.4,"u":0},{"f":"yaourt","q":125,"u":1}],"placard":["ras el hanout doux","cumin"],"dessert":"yaourt nature","etapes":["Dans un plat, courgettes surgelées, pulpe de tomates et épices ; couvrir et cuire 6 min au micro-ondes.","Ajouter les pois chiches égouttés, 2 min de plus.","Semoule : la couvrir de son volume d'eau bouillante salée (bouilloire ou 2 min au micro-ondes), couvrir 5 min, égrener à la fourchette avec l'huile.","Servir les légumes sur la semoule. Dessert : yaourt nature."]},{"id":"R47","nom":"Pizza express à la pâte au yaourt, champignons et emmental ; carottes râpées","moments":["midi","soir"],"prep":15,"cuisson":12,"appareils":["four"],"lignes":[{"f":"farine","q":70,"u":0},{"f":"yaourt","q":35,"u":0},{"f":"colza","q":9,"u":0},{"f":"pureeTomate","q":60,"u":0},{"f":"champignons","q":60,"u":0},{"f":"emmental","q":25,"u":0},{"f":"sel","q":0.35,"u":0},{"f":"carotteCrue","q":80,"u":0}],"placard":["levure chimique (1 sachet pour 3)","origan","vinaigre"],"etapes":["Préchauffer le four à chaleur tournante 200 °C.","Pâte sans levée : farine, levure, sel, yaourt et la moitié de l'huile ; pétrir 2 min, étaler finement sur une plaque couverte de papier cuisson.","Étaler la purée de tomates, les champignons surgelés, l'emmental et l'origan ; cuire 12 à 15 min.","Pendant ce temps, râper les carottes et les assaisonner du reste de l'huile et d'un trait de vinaigre."]},{"id":"R48","nom":"Galettes d'avoine aux carottes et à l'emmental à l'air fryer, haricots verts","moments":["midi","soir"],"prep":10,"cuisson":15,"appareils":["airfryer","micro"],"lignes":[{"f":"avoine","q":50,"u":0},{"f":"oeuf","q":0.5,"u":0},{"f":"lait","q":40,"u":0},{"f":"carotteCrue","q":60,"u":0},{"f":"oignon","q":15,"u":0},{"f":"emmental","q":15,"u":0},{"f":"colza","q":6,"u":0},{"f":"sel","q":0.35,"u":0},{"f":"haricotsVerts","q":120,"u":0},{"f":"yaourt","q":125,"u":1}],"placard":["persil","cumin"],"dessert":"yaourt nature","etapes":["Mélanger flocons d'avoine, œufs battus, lait, carottes râpées, oignon haché fin, emmental et sel ; laisser gonfler 5 min.","Former des galettes, les badigeonner d'huile ; air fryer 190 °C, 12 à 14 min en les retournant à mi-cuisson.","Cuire les haricots verts surgelés 8 à 10 min au micro-ondes (couverts), un filet d'huile. Dessert : yaourt nature."]},{"id":"R49","nom":"Pommes de terre au micro-ondes, fromage blanc aux herbes et carottes râpées","moments":["midi","soir"],"prep":5,"cuisson":10,"appareils":["micro"],"lignes":[{"f":"pdt","q":280,"u":0},{"f":"fblanc","q":100,"u":0},{"f":"emmental","q":10,"u":0},{"f":"carotteCrue","q":80,"u":0},{"f":"colza","q":6,"u":0},{"f":"citron","q":5,"u":0},{"f":"sel","q":0.35,"u":0},{"f":"compote","q":100,"u":1}],"placard":["ciboulette ou fines herbes","ail"],"dessert":"compote","etapes":["Laver les pommes de terre, les piquer, les cuire 8 à 10 min au micro-ondes (couvertes), selon la taille.","Mélanger le fromage blanc avec les herbes, un peu d'ail, sel et poivre.","Râper les carottes, les assaisonner d'huile et de citron.","Ouvrir les pommes de terre, garnir de fromage blanc et d'emmental. Dessert : compote."]},{"id":"R50","nom":"Taboulé aux pois chiches, tomates et carottes","moments":["midi","soir"],"prep":10,"cuisson":0,"appareils":["micro|plaques"],"lignes":[{"f":"couscous","q":70,"u":0},{"f":"poisChiches","q":80,"u":0},{"f":"tomate","q":80,"u":0},{"f":"carotteCrue","q":60,"u":0},{"f":"colza","q":10,"u":0},{"f":"citron","q":8,"u":0},{"f":"sel","q":0.35,"u":0},{"f":"yaourt","q":125,"u":1}],"placard":["menthe ou persil","cumin"],"dessert":"yaourt nature","etapes":["Couvrir la semoule de son volume d'eau bouillante salée (bouilloire ou 2 min au micro-ondes), couvrir 5 min, égrener à la fourchette.","Couper les tomates en dés, râper les carottes, égoutter les pois chiches.","Mélanger le tout avec l'huile, le citron, les herbes et le cumin. Dessert : yaourt nature."]},{"id":"R51","nom":"Colin pané maison à l'air fryer, pommes de terre et haricots verts","moments":["midi","soir"],"prep":10,"cuisson":15,"appareils":["airfryer","micro"],"lignes":[{"f":"colin","q":90,"u":0},{"f":"painMie","q":12,"u":0},{"f":"oeuf","q":0.25,"u":0},{"f":"farine","q":5,"u":0},{"f":"colza","q":6,"u":0},{"f":"pdt","q":200,"u":0},{"f":"haricotsVerts","q":100,"u":0},{"f":"citron","q":5,"u":0},{"f":"sel","q":0.35,"u":0}],"placard":["persil"],"etapes":["Émietter le pain de mie (chapelure). Passer les filets de colin décongelés et séchés dans la farine, l'œuf battu puis la chapelure.","Les huiler au pinceau ; air fryer 190 °C, 10 à 12 min en les retournant à mi-cuisson.","Pendant ce temps, cuire au micro-ondes les pommes de terre en morceaux (10 min) puis les haricots verts (8 min), couverts.","Servir avec un trait de citron."]},{"id":"R52","nom":"Falafels de pois chiches à l'air fryer, semoule et sauce au yaourt","moments":["midi","soir"],"prep":15,"cuisson":15,"appareils":["airfryer"],"lignes":[{"f":"poisChiches","q":110,"u":0},{"f":"farine","q":15,"u":0},{"f":"oignon","q":20,"u":0},{"f":"colza","q":8,"u":0},{"f":"sel","q":0.4,"u":0},{"f":"couscous","q":50,"u":0},{"f":"yaourt","q":60,"u":0},{"f":"carotteCrue","q":60,"u":0},{"f":"citron","q":3,"u":0}],"placard":["cumin","coriandre ou persil","ail","levure chimique (1 cuillère à café)"],"etapes":["Mixer les pois chiches égouttés avec l'oignon, l'ail, la farine, les herbes, le cumin, la levure et le sel (pâte qui se tient).","Former des boulettes aplaties, les badigeonner d'huile ; air fryer 190 °C, 12 à 15 min en les retournant à mi-cuisson.","Semoule : son volume d'eau bouillante salée, 5 min à couvert. Sauce : yaourt, citron, sel, herbes.","Servir avec les carottes râpées."]},{"id":"R53","nom":"Omelette aux champignons, tartines et carottes râpées","moments":["midi","soir"],"prep":5,"cuisson":8,"appareils":["plaques"],"lignes":[{"f":"oeuf","q":1.5,"u":0},{"f":"champignons","q":60,"u":0},{"f":"lait","q":20,"u":0},{"f":"colza","q":8,"u":0},{"f":"emmental","q":10,"u":0},{"f":"sel","q":0.3,"u":0},{"f":"painMie","q":70,"u":0},{"f":"carotteCrue","q":80,"u":0}],"placard":["persil","vinaigre"],"etapes":["Faire revenir les champignons surgelés 4 à 5 min à la poêle dans un peu d'huile.","Battre les œufs avec le lait et le sel, verser sur les champignons, parsemer d'emmental ; cuire 3 à 4 min à feu moyen.","Servir avec le pain de mie et les carottes râpées (huile, vinaigre)."]},{"id":"R54","nom":"Salade de riz au thon, maïs, tomates et carottes","moments":["midi","soir"],"prep":10,"cuisson":12,"appareils":["plaques|micro"],"lignes":[{"f":"basmati","q":75,"u":0},{"f":"thon","q":20,"u":0},{"f":"mais","q":40,"u":0},{"f":"tomate","q":60,"u":0},{"f":"carotteCrue","q":60,"u":0},{"f":"colza","q":10,"u":0},{"f":"citron","q":5,"u":0},{"f":"sel","q":0.35,"u":0},{"f":"yaourt","q":125,"u":1}],"placard":["vinaigre","moutarde"],"dessert":"yaourt nature","etapes":["Cuire le riz (casserole 12 min, ou micro-ondes 12 min dans deux fois son volume d'eau), le rincer à l'eau froide.","Couper les tomates en dés, râper les carottes, égoutter thon et maïs.","Mélanger avec une vinaigrette huile-moutarde-citron. Dessert : yaourt nature."]},{"id":"R55","nom":"Pâtes aux pois chiches à la tomate","moments":["midi","soir"],"prep":5,"cuisson":15,"appareils":["plaques"],"lignes":[{"f":"spaghetti","q":75,"u":0},{"f":"poisChiches","q":90,"u":0},{"f":"pulpeTomate","q":100,"u":0},{"f":"oignon","q":20,"u":0},{"f":"colza","q":10,"u":0},{"f":"emmental","q":8,"u":0},{"f":"sel","q":0.4,"u":0},{"f":"yaourt","q":125,"u":1}],"placard":["ail","romarin ou herbes de Provence"],"dessert":"yaourt nature","etapes":["Faire revenir l'oignon et l'ail dans l'huile, ajouter la pulpe de tomates, les pois chiches égouttés, les herbes et 20 cl d'eau ; mijoter 10 min.","Écraser grossièrement un tiers des pois chiches pour lier la sauce.","Cuire les spaghetti cassés en tronçons, les mélanger à la sauce, parsemer d'emmental. Dessert : yaourt nature."]},{"id":"R56","nom":"Pâtes complètes à l'ail, épinards et œuf","moments":["midi","soir"],"prep":5,"cuisson":12,"appareils":["plaques","micro"],"lignes":[{"f":"patesCompl","q":90,"u":0},{"f":"epinards","q":120,"u":0},{"f":"colza","q":10,"u":0},{"f":"oeuf","q":0.5,"u":0},{"f":"emmental","q":10,"u":0},{"f":"sel","q":0.35,"u":0},{"f":"compote","q":100,"u":1}],"placard":["ail","muscade"],"dessert":"compote","etapes":["Cuire les pâtes ; cuire les épinards surgelés 6 à 8 min au micro-ondes (couverts), bien les égoutter.","Battre les œufs avec l'emmental, le sel et la muscade.","Égoutter les pâtes, les remettre dans la casserole hors du feu avec l'huile, l'ail et les épinards, verser les œufs et mélanger 1 min (ils prennent à la chaleur des pâtes). Dessert : compote."]},{"id":"R57","nom":"Dal express de lentilles corail à la tomate, riz basmati","moments":["midi","soir"],"prep":5,"cuisson":20,"appareils":["plaques"],"lignes":[{"f":"lentCorail","q":60,"u":0},{"f":"basmati","q":60,"u":0},{"f":"pulpeTomate","q":80,"u":0},{"f":"oignon","q":20,"u":0},{"f":"colza","q":10,"u":0},{"f":"sel","q":0.4,"u":0},{"f":"yaourt","q":125,"u":1}],"placard":["curry doux","cumin","ail","gingembre (facultatif)"],"dessert":"yaourt nature","etapes":["Faire revenir l'oignon dans l'huile avec les épices 2 min.","Ajouter les lentilles rincées, la pulpe de tomates et 3 fois le volume des lentilles en eau ; cuire 15 à 18 min en remuant de temps en temps.","Pendant ce temps, cuire le riz. Dessert : yaourt nature (ou une cuillère sur le dal)."]},{"id":"R58","nom":"Pain perdu salé à l'emmental au four, carottes râpées","moments":["midi","soir"],"prep":10,"cuisson":15,"appareils":["four|airfryer"],"lignes":[{"f":"painMie","q":90,"u":0},{"f":"oeuf","q":0.5,"u":0},{"f":"lait","q":100,"u":0},{"f":"emmental","q":15,"u":0},{"f":"colza","q":8,"u":0},{"f":"carotteCrue","q":80,"u":0},{"f":"sel","q":0.3,"u":0}],"placard":["muscade","herbes de Provence","vinaigre"],"etapes":["Préchauffer le four à chaleur tournante 180 °C (ou l'air fryer à 180 °C).","Battre les œufs avec le lait, le sel, la muscade et les herbes ; y tremper les tranches de pain de mie.","Les poser sur une plaque huilée, parsemer d'emmental ; 12 à 15 min au four (8 à 10 min à l'air fryer).","Servir avec les carottes râpées assaisonnées d'huile et de vinaigre."]},{"id":"R59","nom":"Riz aux haricots rouges, carottes et maïs","moments":["midi","soir"],"prep":5,"cuisson":20,"appareils":["plaques"],"lignes":[{"f":"basmati","q":70,"u":0},{"f":"harRouges","q":80,"u":0},{"f":"carotteCuite","q":60,"u":0},{"f":"mais","q":30,"u":0},{"f":"oignon","q":20,"u":0},{"f":"colza","q":10,"u":0},{"f":"sel","q":0.4,"u":0},{"f":"yaourt","q":125,"u":1}],"placard":["paprika doux","thym","ail"],"dessert":"yaourt nature","etapes":["Faire revenir l'oignon et la carotte en petits dés dans l'huile 3 min, avec le paprika et le thym.","Ajouter le riz, l'enrober 1 min, puis 2 fois son volume d'eau salée ; cuire 12 min à couvert.","Ajouter les haricots rouges et le maïs égouttés, 3 min à couvert hors du feu. Dessert : yaourt nature."]},{"id":"X1","nom":"Repas pris à l'extérieur (estimation type cantine)","moments":["midi","soir"],"prep":0,"cuisson":0,"exterieur":true,"lignes":[{"f":"carotteCrue","q":60,"u":0},{"f":"colza","q":4,"u":0},{"f":"pouletFilet","q":80,"u":0},{"f":"spaghetti","q":60,"u":0},{"f":"haricotsVerts","q":100,"u":0},{"f":"yaourt","q":125,"u":1},{"f":"pomme","q":120,"u":1},{"f":"painCampagne","q":30,"u":0},{"f":"sel","q":0.65,"u":0}],"etapes":["Estimation d'un repas type de restauration collective (entrée de crudités, viande blanche, féculent, légume, laitage, fruit, pain).","Sert uniquement au bilan nutritionnel : rien n'est ajouté aux courses."]}]}</script>
<script id="exigences-liste" type="application/json">[{"id":"E01","texte":"Fichier HTML unique et autonome : styles, données et scripts intégrés, aucune ressource réseau nécessaire, fonctionne ouvert depuis le disque ; seul accès réseau, la synchronisation GitHub facultative, une fois configurée par l'utilisateur."},{"id":"E02","texte":"Foyer de 2 adultes et 1 enfant de 7 ans, chacun réglable (sexe, âge, poids, taille, activité)."},{"id":"E03","texte":"Références nutritionnelles ANSES propres à chaque profil (adulte homme, adulte femme, enfant 7-10 ans), avec leur type (RNP, AS, limite) et leur source."},{"id":"E04","texte":"Nutriments suivis : magnésium, fer, calcium, zinc, potassium, phosphore, iode, sélénium, cuivre, sodium, vitamines A, D, E, C, B1, B2, B6, B9, B12, oméga-3 (ALA, EPA + DHA), fibres, protéines, énergie, glucides, sucres, lipides, acides gras saturés."},{"id":"E05","texte":"Composition des aliments issue de la table CIQUAL 2025 de l'ANSES, avec le code et le libellé CIQUAL de chaque aliment."},{"id":"E06","texte":"Recettes du déjeuner et du dîner (au moins 40 plats), planifiés ; recettes de petit-déjeuner et de goûter gardées (au moins 6 de chaque) pour choisir les repas habituels ou planifier les 4 repas en option."},{"id":"E07","texte":"Chaque recette donne ses ingrédients chiffrés, ses étapes, ses temps de préparation et de cuisson."},{"id":"E08","texte":"Quantités données pour chaque personne et pour toute la famille."},{"id":"E09","texte":"Planning de 7 jours modifiable à la main, avec verrouillage des choix : déjeuner et dîner par défaut, les 4 moments en option."},{"id":"E10","texte":"Générateur de semaine équilibrée qui améliore mesurablement l'équilibre par rapport à des semaines tirées au hasard, et respecte les verrous."},{"id":"E11","texte":"Bilan par personne : apport moyen par jour comparé au repère, taux de couverture, alertes de manque et d'excès (limites de sécurité, sodium, sucres, acides gras saturés)."},{"id":"E12","texte":"Repères PNNS contrôlés sur la semaine : fruits et légumes, produits laitiers, légumes secs, poisson et poisson gras, viande, charcuterie, féculents complets."},{"id":"E13","texte":"Prix Carrefour pour chaque article (libellé, format, prix, date et source du relevé), modifiables et conservés."},{"id":"E14","texte":"Coût par repas, par jour et par semaine pour le foyer."},{"id":"E15","texte":"Liste de courses de la semaine regroupée par rayon, en paquets entiers, avec le total."},{"id":"E16","texte":"Eau de boisson de chaque personne prise en compte (calcium, magnésium, sodium des eaux vendues chez Carrefour ou du robinet)."},{"id":"E17","texte":"Suggestions pour combler un manque : aliments, recettes et eaux riches dans le nutriment, avec leur apport et leur coût."},{"id":"E18","texte":"Conversion poids cru → poids cuit (rendement) et partie comestible prises en compte."},{"id":"E19","texte":"Portions indivisibles (yaourt, fruit, verre de lait) et facteur de portion calé sur le besoin énergétique de chacun."},{"id":"E20","texte":"Repas pris dehors (cantine, travail) : estimés dans le bilan, exclus des courses et du coût."},{"id":"E21","texte":"Données manquantes de la table CIQUAL signalées (taux de complétude par nutriment)."},{"id":"E22","texte":"Sauvegarde locale qui ne bloque jamais l'outil si le navigateur la refuse, export et import des réglages."},{"id":"E23","texte":"Lisible sur téléphone : pas de défilement horizontal de la page à 390 px de large."},{"id":"E24","texte":"Aucune erreur JavaScript au chargement ni en parcourant tous les onglets dans un vrai navigateur."},{"id":"E25","texte":"Avertissement : outil d'information, pas un avis médical ; vitamine D et compléments à voir avec le médecin."},{"id":"E26","texte":"Budget par jour du foyer, le plus bas possible sans perdre l'équilibre : 8 € au plus par défaut pour le déjeuner et le dîner (12 € si les 4 repas sont planifiés), cible 6 €. Le générateur ne propose aucun jour au-dessus du maximum quand c'est possible ; le coût de chaque jour est affiché et un jour au-dessus est signalé."},{"id":"E27","texte":"Besoin énergétique calculé pour chacun d'après son profil : Black et al. (1996) pour les adultes (poids, taille, âge, activité), Schofield (OMS 1985) × activité + croissance pour l'enfant (poids, activité), cohérent avec les besoins ANSES des 7-10 ans."},{"id":"E28","texte":"Mises en garde sur l'eau de boisson tirées des étiquettes (fluor au-delà de 1,5 mg/L avec la mention légale pour l'enfant, sulfates, sodium, minéralisation), affichées dans le foyer et dans les suggestions."},{"id":"E29","texte":"Préparation de chaque repas limitée hors cuisson : 20 min au plus par défaut, 15 ou 10 min au choix. Le générateur ne propose aucune recette plus longue ; une recette plus longue choisie à la main est signalée."},{"id":"E30","texte":"Prochain repas à préparer au premier plan : premier écran à l'ouverture et rappel en tête des autres onglets, avec l'heure du repas et celle où commencer, les personnes présentes, les quantités pour toutes et pour chacune, les étapes ; « C'est prêt » passe au repas suivant."},{"id":"E31","texte":"Données à jour sur n'importe quel appareil (téléphone, tablette, PC), comme l'outil NHL : synchronisation par un dépôt GitHub privé de l'utilisateur, jeton gardé dans le navigateur (jamais exporté ni envoyé dans le dépôt), dépôt public refusé, modifications de plusieurs appareils fusionnées."},{"id":"E32","texte":"Édition en ligne installable (GitHub Pages : manifeste, service worker, icônes), utilisable hors connexion, et liaison d'un nouvel appareil par lien ou QR code."},{"id":"E33","texte":"Seuls le déjeuner et le dîner sont planifiés (petit-déjeuner et goûter libres) : eux seuls figurent dans la semaine, les courses, le budget et le prochain repas ; le bilan compte le petit-déjeuner et le goûter habituels choisis pour chacun."},{"id":"E34","texte":"Recettes adaptées à l'équipement du foyer : air fryer, four à chaleur tournante (températures données en chaleur tournante), micro-ondes et plaques ; appareils indiqués sur chaque recette ; aucune proposition du générateur qui demande un appareil décoché."},{"id":"E35","texte":"Repas rapides : au moins 15 plats prêts avec 10 min de préparation au plus (hors cuisson), dont des plats à l'air fryer et au micro-ondes, repérables par le filtre « Rapide »."}]</script>

  // ------------------------------------------------------------------ besoins
  // Enfant : métabolisme de base de Schofield (OMS 1985) d'après le poids, × niveau d'activité (NAP),
  // + 1 % pour la croissance. Au poids de référence des 7-10 ans (≈ 28 kg) et au NAP 1,6, on retrouve

  var NAP_ENFANT = { faible: 1.4, moyenne: 1.6, elevee: 1.8 };

  }

      R.k = { t: 'AS', v: 3500, src: A21 };

      R.i = { t: 'AS', v: 150, lss: 600, src: A21 };
      R.vitA = { t: 'RNP', v: H ? 750 : 650, src: A21 };
      R.vitD = { t: 'AS', v: 15, lss: 100, src: A21 };
      R.vitE = { t: 'AS', v: H ? 10 : 9, lss: 300, src: A21 };
      R.vitC = { t: 'RNP', v: 110, src: A21 };

      R.fib = { t: 'AS', v: 16, src: 'ANSES 2019 (7-10 ans)' };
      R.ca = { t: 'RNP', v: 800, src: A21 + ' (4-10 ans)' };
      R.mg = { t: 'AS', v: 240, src: A21 + ' (7-10 ans)', note: 'La limite de 250 mg ne concerne que les compléments.' };
      R.fe = { t: 'RNP', v: 6, lss: 20, src: A21 + ' (7-11 ans)' };
      R.zn = { t: 'RNP', v: 7.4, lss: 13, src: A21 + ' (7-10 ans)' };

      R.p = { t: 'AS', v: 440, src: A21 + ' (7-10 ans)' };

      R.se = { t: 'AS', v: 35, lss: 130, src: A21 + ' (7-10 ans)' };
      R.i = { t: 'AS', v: 90, lss: 300, src: A21 + ' (7-10 ans)' };
      R.vitA = { t: 'RNP', v: 400, src: A21 + ' (7-10 ans)' };
      R.vitD = { t: 'AS', v: 15, lss: 50, src: A21 + ' (4-10 ans)' };
      R.vitE = { t: 'AS', v: 9, lss: 160, src: A21 + ' (7-10 ans)' };
      R.vitC = { t: 'RNP', v: 45, src: A21 + ' (7-10 ans)' };
      R.b2 = { t: 'RNP', v: 1.0, src: A21 + ' (7-10 ans)' };
      R.b6 = { t: 'RNP', v: 1.0, lss: 6.1, src: A21 + ' (7-10 ans)' };
      R.b9 = { t: 'RNP', v: 200, src: A21 + ' (7-10 ans)' };
      R.b12 = { t: 'AS', v: 1.5, src: A21 + ' (4-10 ans)' };

  }

  function horsTranche(p) {
    return p.type === 'enfant' && (p.age < 7 || p.age > 10);
  }

  function statut(ref, val) {
    if (!ref) return 'na';
    if (ref.lss != null && val > ref.lss) return 'lss';
    if (ref.t === 'RNP' || ref.t === 'AS') { var c = val / ref.v; return c >= 1 ? 'ok' : (c >= 0.7 ? 'proche' : 'bas'); }
    if (ref.t === 'max') return val > ref.v ? 'exces' : 'ok';
    if (ref.t === 'plage') {
      if (val < ref.min) return val < 0.85 * ref.min ? 'bas' : 'proche';
      if (val > ref.max) return val > 1.15 * ref.max ? 'exces' : 'proche';
      return 'ok';
    }
    if (ref.t === 'cible') { var c2 = val / ref.v; return c2 < 0.9 ? 'bas' : (c2 > 1.1 ? 'exces' : 'ok'); }
    return 'na';
  }

  // ------------------------------------------------------------------ aliments, prix, rendements
  function prixEffectif(st, id) {
    var b = ACH[id], o = (st && st.prix && st.prix[id]) || {};
    return { id: id, nom: b.nom, marque: b.marque, unite: b.unite, comest: b.comest, gpc: b.gpc, rayon: b.rayon, ean: b.ean, date: b.date, src: b.src,
      prix: o.prix != null ? o.prix : b.prix, qte: o.qte != null ? o.qte : b.qte, modifie: o.prix != null || o.qte != null, prixDefaut: b.prix, qteDefaut: b.qte };
  }
  // poids mesuré en cuisine (g) d'une quantité exprimée dans l'unité de l'aliment
  function grammes(a, q) {
    if (a.unite === 'ml') return q * (a.dens || 1);
    if (a.unite === 'pc') return q * (a.gpc || 50);
    return q;
  }
  // poids dans l'état de l'entrée CIQUAL (rendement cru -> cuit)
  function grammesCiqual(a, q) { return grammes(a, q) * (a.y || 1); }
  // quantité d'achat (dans l'unité de l'article : g, ml ou pièces), partie comestible incluse
  function qteAchat(st, a, q) {
    var p = prixEffectif(st, a.achat), gm = grammes(a, q);
    if (p.unite === 'pc') return gm / (p.gpc || 1);
    if (p.unite === 'ml') return (gm / (a.dens || 1)) / (p.comest || 1);
    return gm / (p.comest || 1);
  }
  function coutLigne(st, a, q) {
    var p = prixEffectif(st, a.achat);
    return qteAchat(st, a, q) * p.prix / p.qte;
  }
  function valeur(a, k) {
    if (k === 'epadha') { var e = a.v.epa, h = a.v.dha; return (e == null || h == null) ? null : e + h; }
    return a.v[k];
  }
  function nutrimentsAliment(fid, q) {
    var a = AL[fid], g = grammesCiqual(a, q), o = {};
    K.forEach(function (k) { var v = valeur(a, k); o[k] = v == null ? null : v * g / 100; });
    return o;
  }
  function aliment(fid, st) {
    var subs = (st && st.substitutions) || {};
    return AL[subs[fid] || fid] ? (subs[fid] || fid) : fid;
  }

  // ------------------------------------------------------------------ vecteurs de recette
  function vecteurRecette(st, r) {
    var o = { id: r.id, Vu: zeros(NF), Vs: zeros(NF), Mu: zeros(NK), Ms: zeros(NK), Gu: 0, Gs: 0, Cu: 0, Cs: 0, Au: {}, As: {}, leg: 0, poi: 0, pg: 0 };
    r.lignes.forEach(function (l) {
      var fid = aliment(l.f, st), a = AL[fid];
      var gm = grammes(a, l.q), gN = gm * (a.y || 1);
      var V = l.u ? o.Vu : o.Vs, M = l.u ? o.Mu : o.Ms;
      for (var i = 0; i < NK; i++) {
        var v = valeur(a, K[i]);
        if (v == null) M[i] += gm; else V[i] += v * gN / 100;
      }
      var cats = a.cats;
      var c0 = cats.map(function (c) { return c.split(':')[0]; });
      if (c0.indexOf('fruit') >= 0 || c0.indexOf('legume') >= 0) V[FI.fl] += gm;
      cats.forEach(function (c) { if (c.indexOf('laitier:') === 0) V[FI.pl] += l.q / Number(c.split(':')[1]); });
      if (c0.indexOf('viande') >= 0) V[FI.vi] += gm;
      if (c0.indexOf('charcuterie') >= 0) V[FI.ch] += gm;
      if (c0.indexOf('feculentComplet') >= 0) V[FI.fc] += gm;
      if (c0.indexOf('fruitCoque') >= 0) V[FI.nx] += gm;
      if (c0.indexOf('legSecs') >= 0) o.leg = 1;
      if (c0.indexOf('poisson') >= 0) o.poi = 1;
      if (c0.indexOf('poissonGras') >= 0) o.pg = 1;
      if (c0.indexOf('eau') < 0) { if (l.u) o.Gu += gm; else o.Gs += gm; }
      var qa = qteAchat(st, a, l.q), p = prixEffectif(st, a.achat);
      var A = l.u ? o.Au : o.As;
      A[a.achat] = (A[a.achat] || 0) + qa;
      if (l.u) o.Cu += qa * p.prix / p.qte; else o.Cs += qa * p.prix / p.qte;
    });
    return o;
  }

  function vecteurEau(st, wid, ml) {
    var a = AL[wid], v = zeros(NF), dens = a.dens || 1, p = prixEffectif(st, a.achat);
    for (var i = 0; i < NK; i++) { var x = valeur(a, K[i]); v[i] = (x || 0) * ml * dens / 100; }
    return { V: v, cout: (ml / (p.comest || 1)) * p.prix / p.qte, achat: a.achat, qte: ml };
  }

  // Mises en garde d'étiquette sur l'eau de boisson. Seuils réglementaires (directives 2003/40/CE et
  // 2009/54/CE) : fluor > 1,5 mg/L (mention obligatoire), sodium > 200 mg/L (« contient du sodium »),
  // résidu sec > 1 500 mg/L (« riche en sels minéraux ») ; sulfates > 1 000 mg/L : effet laxatif possible.
  function virgule(x) { return String(x).replace('.', ','); }
  function avertissementsEau(fid, p) {
    var a = AL[fid], L = [];
    if (!a || a.cats.indexOf('eau') < 0) return L;
    var e = a.etiquette || {}, na = (a.v.na || 0) * 10, enfant = !!(p && p.type === 'enfant');
    if (e.fluor != null && e.fluor > 1.5) {
      L.push({ k: 'fluor', grave: enfant, texte: 'contient plus de 1,5 mg/L de fluor (' + virgule(e.fluor) + ' mg/L) : la mention légale la déconseille aux nourrissons et aux enfants de moins de 7 ans en consommation régulière' +
        (enfant ? (p.age < 7 ? ' ; elle ne convient donc pas à cet enfant comme eau de tous les jours' : ' ; à ' + p.age + ' ans, demander l\'avis du médecin ou du dentiste avant d\'en faire l\'eau de tous les jours (le dentifrice apporte déjà du fluor)') : '') });
    }
    if (e.sulfates != null && e.sulfates > 1000) L.push({ k: 'sulfates', grave: false, texte: 'riche en sulfates (' + e.sulfates + ' mg/L) : effet laxatif possible, à introduire progressivement' });
    if (na > 200) L.push({ k: 'sodium', grave: false, texte: 'contient du sodium (' + Math.round(na) + ' mg/L), compté dans le sel de la journée' });
    if (enfant && e.residu != null && e.residu > 1500) L.push({ k: 'mineralisation', grave: false, texte: 'riche en sels minéraux (résidu sec ' + e.residu + ' mg/L) : pour un enfant, avis du médecin si elle devient l\'eau de tous les jours' });
    return L;
  }

  // la recette tient-elle dans le temps de préparation choisi (hors cuisson) ?
  function prepOk(st, r) { return !st.prepMax || r.prep <= st.prepMax; }
  function preparer(st) {
    // cand : ce que le générateur peut proposer (temps de préparation respecté) ; candTous : choix à la main
    var ctx = { rec: {}, ext: null, cand: [], candTous: [] };
    RECS.forEach(function (r) { var v = vecteurRecette(st, r); if (r.exterieur) ctx.ext = v; else ctx.rec[r.id] = v; });
    for (var d = 0; d < 7; d++) {
      var tous = MOMENTS.map(function (m, s) {
        if (creneauLibre(st, s)) return [];   // petit-déjeuner et goûter libres : rien à planifier
        return RECS.filter(function (r) { return !r.exterieur && r.moments.indexOf(m.k) >= 0 && (!r.jours || r.jours.indexOf(d) >= 0); }).map(function (r) { return r.id; });
      });
      ctx.candTous.push(tous);
      ctx.cand.push(tous.map(function (L) {
        var ok = L.filter(function (id) { return prepOk(st, RECETTE[id]) && equipementOk(st, RECETTE[id]); });
        if (!ok.length) ok = L.filter(function (id) { return equipementOk(st, RECETTE[id]); });
        return ok.length ? ok : L;   // jamais de créneau planifié sans proposition
      }));
    }
    ctx.eau = st.personnes.map(function (p) { return vecteurEau(st, p.eau, p.eauMl); });
    return ctx;
  }

  // ------------------------------------------------------------------ évaluation d'une semaine
  // facteur borné : 2,0 au plus depuis la v1.3.0 (1,8 avant) — sans goûter, un grand adulte a besoin de portions
  // près de deux fois la portion de référence au déjeuner et au dîner
  var FACTEUR_MIN = 0.5, FACTEUR_MAX = 2.0;
  function facteurPortion(p, Eu, Es, E) {
    if (p.facteurMode === 'manuel') return p.facteurManuel;
    if (Es <= 0) return 1;
    return clamp((7 * E - Eu) / Es, FACTEUR_MIN, FACTEUR_MAX);
  }

  function evaluer(st, ctx, leger) {
    var res = { personnes: [], cout: 0, coutEau: 0, coutJours: [0, 0, 0, 0, 0, 0, 0], coutEauJour: 0, coutLibres: 0 };
    st.personnes.forEach(function (p, pi) {
      var SU = zeros(NF), SS = zeros(NF), MU = zeros(NK), MS = zeros(NK), GU = 0, GS = 0, CU = 0, CS = 0;
      var leg = 0, poi = 0, pg = 0, nRepasDehors = 0, nVides = 0;
      var jU = [], jS = [], fcU = [0, 0, 0, 0, 0, 0, 0], fcS = [0, 0, 0, 0, 0, 0, 0];
      var cuJ = [0, 0, 0, 0, 0, 0, 0], csJ = [0, 0, 0, 0, 0, 0, 0];  // coût des repas pris à la maison, par jour
      var CUL = 0, CSL = 0, nLibres = 0;                               // repas habituels des créneaux libres (pour information)
      for (var d = 0; d < 7; d++) {
        var dU = leger ? null : zeros(NF), dS = leger ? null : zeros(NF);
        for (var s = 0; s < 4; s++) {
          var R = null, ext = false;
          if (p.presence[d][s] && creneauLibre(st, s)) {
            var hid = habitude(st, p, s);
            if (hid) { R = ctx.rec[hid]; ext = true; CUL += R.Cu; CSL += R.Cs; nLibres++; }
          }
          else if (p.presence[d][s]) { var id = st.plan[d][s]; if (id) R = ctx.rec[id]; else nVides++; }
          else if (MOMENTS[s].repas) { R = ctx.ext; ext = true; nRepasDehors++; }
          if (!R) continue;
          ajoute(SU, R.Vu, 1); ajoute(SS, R.Vs, 1);
          fcU[d] += R.Vu[FI.fc]; fcS[d] += R.Vs[FI.fc];  // féculents complets du jour (repère « chaque jour »), aussi en mode léger
          if (!leger) { ajoute(dU, R.Vu, 1); ajoute(dS, R.Vs, 1); ajoute(MU, R.Mu, 1); ajoute(MS, R.Ms, 1); GU += R.Gu; GS += R.Gs; }
          if (!ext) { CU += R.Cu; CS += R.Cs; cuJ[d] += R.Cu; csJ[d] += R.Cs; }
          leg += R.leg; poi += R.poi; pg += R.pg;
        }
        if (!leger) { jU.push(dU); jS.push(dS); }
      }
      var E = besoinEnergie(p);
      var F = facteurPortion(p, SU[KI.kcal], SS[KI.kcal], E);
      var eau = ctx.eau[pi];
      var sem = zeros(NF); ajoute(sem, SU, 1); ajoute(sem, SS, F); ajoute(sem, eau.V, 7);
      var moy = zeros(NF); ajoute(moy, sem, 1 / 7);
      var refs = references(p, E);
      var sFc = SEUIL_FC * Math.min(1, F) - 1e-9, joursFc = 0;
      for (var dj = 0; dj < 7; dj++) if (fcU[dj] + F * fcS[dj] >= sFc) joursFc++;
      var out = { id: p.id, nom: p.nom, E: E, F: F, moy: moy, sem: sem, refs: refs, leg: leg, poi: poi, pg: pg, joursFc: joursFc,
        cout: CU + F * CS + 7 * eau.cout, coutEau: 7 * eau.cout, nRepasDehors: nRepasDehors, nVides: nVides,
        coutJours: cuJ.map(function (u, d) { return u + F * csJ[d] + eau.cout; }), coutLibres: CUL + F * CSL, nLibres: nLibres };
      res.coutLibres += out.coutLibres;
      for (var dc = 0; dc < 7; dc++) res.coutJours[dc] += out.coutJours[dc];
      res.coutEauJour += eau.cout;
      if (!leger) {
        out.jours = jU.map(function (u, d) { var v = zeros(NF); ajoute(v, u, 1); ajoute(v, jS[d], F); ajoute(v, eau.V, 1); return v; });
        out.completude = {};
        var G = GU + F * GS;
        K.forEach(function (k, i) { out.completude[k] = G > 0 ? 1 - (MU[i] + F * MS[i]) / G : 1; });
        out.statuts = {};
        K.forEach(function (k) { if (refs[k]) out.statuts[k] = statut(refs[k], moy[KI[k]]); });
        out.pnns = reperesPNNS(p, out);
      }
      res.cout += out.cout; res.coutEau += out.coutEau;
      res.personnes.push(out);
    });
    return res;
  }

  // ------------------------------------------------------------------ repères PNNS / Santé publique France
  function reperesPNNS(p, pr) {
    var enfant = p.type === 'enfant', F = pr.F;
    var portionFL = 80 * Math.min(1, F);

  // ------------------------------------------------------------------ onglet Recettes
  var TAGS = { rapide: 'Rapide', vegetarien: 'Végétarien', poisson: 'Poisson', legSecs: 'Légumes secs', weekend: 'Week-end' };   // rapide : 10 min de préparation au plus
  function tagsRecette(r) {
    var t = {}, cats = {};
    r.lignes.forEach(function (l) { N.AL[l.f].cats.forEach(function (c) { cats[c.split(':')[0]] = 1; }); });
    if (cats.poisson) t.poisson = 1;
    if (cats.legSecs) t.legSecs = 1;
    if (!cats.viande && !cats.volaille && !cats.charcuterie && !cats.poisson) t.vegetarien = 1;
    if (r.jours) t.weekend = 1;
    if (r.prep <= 10 && !r.exterieur) t.rapide = 1;
    return t;
  }
  function coutFamille(r) {

  }

      '<div class="segmente" role="group" aria-label="Filtre">' + Object.keys(TAGS).map(function (t) {
        return '<button data-action="filtre-tag" data-t="' + t + '" aria-pressed="' + (vue.tag === t) + '"' + (t === 'rapide' ? ' title="10 min de préparation au plus (hors cuisson)"' : '') + '>' + TAGS[t] + '</button>';
      }).join('') + '</div>' +
      (etat.prepMax ? '<button class="btn" data-action="filtre-rapides" aria-pressed="' + vue.rapides + '">Préparation ≤ ' + etat.prepMax + ' min</button>' : '') +
      '<label class="champ" style="flex-direction:row;align-items:center;gap:6px">Appareil <select data-action="filtre-appareil">' +
      [['', 'tous'], ['airfryer', 'air fryer'], ['four', 'four'], ['micro', 'micro-ondes'], ['plaques', 'plaques'], ['aucun', 'sans cuisson']].map(function (o) {
        return '<option value="' + o[0] + '"' + (vue.appareil === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';

    var liste = N.RECS.filter(function (r) {
      if (r.exterieur) return false;

      if (vue.moment !== 'tous' && vue.moment !== 'repas' && r.moments.indexOf(vue.moment) < 0) return false;
      if (vue.tag && !tagsRecette(r)[vue.tag]) return false;
      if (vue.rapides && !N.prepOk(etat, r)) return false;
      if (vue.appareil === 'aucun' && (r.appareils || []).length) return false;
      if (vue.appareil && vue.appareil !== 'aucun' && !(r.appareils || []).some(function (a) { return a.split('|').indexOf(vue.appareil) >= 0; })) return false;
      if (q) { var txt = (r.nom + ' ' + r.lignes.map(function (l) { return N.AL[l.f].nom; }).join(' ')).toLowerCase(); if (txt.indexOf(q) < 0) return false; }
      return true;
    });
    h += '<p class="muet petit">' + liste.length + ' recette' + (liste.length > 1 ? 's' : '') + '. Les quantités de référence correspondent à une portion moyenne ; chaque personne reçoit sa part selon ses besoins (onglet Foyer).</p>';
    h += '<div class="recettes">' + liste.map(function (r) {

        '<div>' + r.moments.map(function (m) { return '<span class="etiquette">' + { matin: 'petit-déjeuner', midi: 'déjeuner', soir: 'dîner', gouter: 'goûter' }[m] + '</span>'; }).join('') +

        '<td class="n"><input type="number" min="0.01" step="any" data-action="prix-qte" data-a="' + id + '" value="' + p.qte + '" aria-label="Format de ' + esc(p.nom) + '"> ' + (p.unite === 'pc' ? 'pc' : p.unite) + '</td>' +

    });
    h += '</tbody></table></div>';
    return h;
  }

  // ------------------------------------------------------------------ onglet Méthode
  function platsRapidesTexte() {
    var plats = N.RECS.filter(function (r) { return !r.exterieur && (r.moments.indexOf('midi') >= 0 || r.moments.indexOf('soir') >= 0); });
    var rapides = plats.filter(function (r) { return r.prep <= 10; }).length;
    return 'Sur les ' + plats.length + ' plats du déjeuner et du dîner, ' + rapides + ' demandent 10 min au plus (filtre « Rapide » de l\'onglet Recettes).';
  }
  function rendreMethode() {
    var audit = N.auditMecanismes(), ok = audit.filter(function (a) { return a.ok; }).length;
    var h = '<div class="section"><h2>Ce que fait l\'outil</h2><div class="carte"><p>Pour chaque personne, l\'outil additionne ce qu\'apportent les recettes de la semaine (et l\'eau bue), compare la moyenne journalière aux références de l\'ANSES et signale ce qui manque ou dépasse. Le générateur cherche, parmi ' + N.RECS.filter(function (r) { return !r.exterieur; }).length + ' recettes, la combinaison qui couvre le mieux les besoins des trois personnes en respectant les repères du PNNS, la variété (chaque plat une fois par semaine ; pâtes, riz, pommes de terre ou semoule 3 fois au plus, jamais le même au déjeuner et au dîner d\'un jour), ton budget par jour, ton temps de préparation et ton équipement. Par défaut, seuls le déjeuner et le dîner sont planifiés ; le petit-déjeuner et le goûter, libres, sont comptés dans le bilan comme le repas habituel de chacun.</p>' +
      '<p class="petit muet">Outil d\'information, pas un avis médical. En cas de régime particulier, d\'allergie, de grossesse ou de croissance qui inquiète, l\'avis du médecin ou d\'un diététicien prime. Les compléments alimentaires (vitamine D notamment) ne sont pas calculés : ils se discutent avec le médecin.</p></div></div>';
    h += '<div class="section"><h2>Sources</h2><div class="carte"><ul class="liste-simple">' +
      '<li>Composition des aliments : ' + esc(N.D.meta.ciqualVersion) + ', ANSES. Chaque aliment de l\'outil renvoie à son code CIQUAL (onglet Recettes, détail).</li>' +
      '<li>Références en vitamines et minéraux : ANSES, page « Les références nutritionnelles en vitamines et minéraux » (21/02/2025). Adultes : RNP ou AS, limites supérieures de sécurité. Enfant : tranches 4-10 et 7-10 ans.</li>' +
      '<li>Lipides et oméga-3 : ANSES 2011 (ALA 1 % de l\'énergie ; EPA 250 mg et DHA 250 mg chez l\'adulte ; acides gras saturés au plus 12 % de l\'énergie). Enfant 7-10 ans : EPA + DHA 250 mg, fibres 16 g (ANSES 2019).</li>' +
      '<li>Sucres hors lactose et galactose : ANSES 2016 (100 g/j adulte, 60 g/j de 4 à 7 ans, 75 g/j de 8 à 12 ans).</li>' +
      '<li>Énergie des adultes : équation de Black et al. (1996) multipliée par le niveau d\'activité. Énergie de l\'enfant : métabolisme de base de Schofield (OMS 1985) d\'après le poids, multiplié par le niveau d\'activité (1,4, 1,6 ou 1,8) et augmenté de 1 % pour la croissance ; au poids de référence des 7-10 ans (environ 28 kg) on retrouve les 1 851 kcal (garçon) et 1 726 kcal (fille) de l\'ANSES 2019, un enfant de 7 ans pesant 23 kg a besoin d\'environ 1 600 kcal. Protéines : 0,83 g/kg/j (adulte, ANSES), 0,91 g/kg/j à 7 ans (EFSA 2012).</li>' +
      '<li>Eaux de boisson : calcium, magnésium et sodium de la table CIQUAL ; sulfates, fluor et résidu sec des étiquettes (tableau Nestlé Waters de juin 2024, fiches carrefour.fr, fiche Rozana). Mises en garde aux seuils des directives européennes : fluor au-delà de 1,5 mg/L (mention obligatoire pour les moins de 7 ans), « contient du sodium » au-delà de 200 mg/L, « riche en sels minéraux » au-delà de 1 500 mg/L ; sulfates au-delà de 1 000 mg/L : effet laxatif possible.</li>' +
      '<li>Repères de consommation : PNNS, Santé publique France ; enfants 4-11 ans : Santé publique France (2024).</li>' +
      '<li>Prix : ' + esc(N.D.meta.prixSrc) + ', relevés le ' + datePrix() + prixRecents().map(function (id) { return ' ; ' + esc(N.ACH[id].nom) + ' le ' + new Date(N.ACH[id].date).toLocaleDateString('fr-FR'); }).join('') + '. Eau magnésienne Carrefour : composition de l\'étiquette (source Prince Noir, Ca 541 mg/L, Mg 85 mg/L).</li></ul></div></div>';
    h += '<div class="section"><h2>Repas planifiés, équipement, budget, préparation, synchronisation</h2><div class="carte"><ul class="liste-simple">' +
      '<li>Repas planifiés : par défaut le déjeuner et le dîner seulement ; eux seuls figurent dans la semaine, les courses, le budget et le prochain repas. Le petit-déjeuner et le goûter, libres, sont comptés dans le bilan comme le repas habituel choisi pour chaque personne (onglet Foyer) ; « pas de petit-déjeuner » ou « pas de goûter » ne compte rien et les portions du déjeuner et du dîner augmentent pour couvrir l\'énergie. Ces repas habituels coûtent environ 3 € par jour pour le foyer (choix par défaut), hors budget. Les 4 repas peuvent être planifiés en option.</li>' +
      '<li>Équipement : chaque recette indique ses appareils (plaques, four à chaleur tournante, air fryer, micro-ondes) ; « air fryer ou four » laisse le choix. Les températures sont données en chaleur tournante. Un appareil décoché dans l\'onglet Foyer écarte du générateur les plats qui en ont besoin ; un plat choisi à la main reste possible et il est signalé.</li>' +
      '<li>Budget par jour : coût du déjeuner et du dîner pris à la maison ce jour-là (au prorata de ce qui est mangé, chaque personne avec sa portion) plus l\'eau de boisson. Le générateur pénalise fortement tout jour au-dessus du maximum (un palier plus 2 points par euro de trop, bien plus que ce qu\'une recette chère apporte en nutriments) et légèrement chaque euro au-dessus de la cible (0,15 point). Mesuré sur 100 semaines générées avec le foyer par défaut (maximum 8 €, cible 6 €) : aucun jour au-dessus de 8 €, 7,60 € par jour en moyenne (10,56 € sans budget, jusqu\'à 21,41 € certains jours). La cible de 6 € n\'est presque jamais atteinte : les 14 plats les moins chers qui respectent la variété reviennent déjà à 6,48 € par jour pour ce foyer ; elle pousse le générateur vers eux. Le budget se paie surtout en vitamine C : 66 % et 57 % du repère pour les adultes (plus de 110 % et 97 % sans budget), tous les repères du PNNS restant atteints. Les repas habituels par défaut (tartines et bol de lait, yaourt-compote-tartine) en apportent très peu : avec le goûter « riz au lait maison et kiwi » pour les adultes (50 semaines), 104 % et 97 %, pour 0,16 € de plus par jour en tout. Avec les 4 repas planifiés (maximum 12 €, cible 10 €, 50 semaines) : 10,70 € par jour.</li>' +
      '<li>Préparation : temps de travail en cuisine hors cuisson (éplucher, couper, mélanger, assembler), tel qu\'indiqué sur chaque recette ; 20 min au plus par défaut, 10, 15 ou 30 min ou sans limite au choix. Au-delà du maximum choisi, le générateur ne propose pas la recette ; choisie à la main, elle est signalée. ' + platsRapidesTexte() + ' Sur 100 semaines générées par défaut, 10,5 repas sur 14 en moyenne demandent 10 min au plus ; avec un maximum de 10 min (50 semaines), le coût monte à 7,74 € par jour et un peu plus de nutriments restent sous leur repère (vitamines B6 et B12 surtout).</li>' +
      '<li>Prochain repas : le planning est une semaine type ; le jour de la semaine donne la colonne, les heures des repas (onglet Foyer) donnent l\'ordre. Seuls les repas planifiés y figurent. Un repas reste affiché jusqu\'à 45 minutes après son heure, ou jusqu\'à « C\'est prêt ». Les quantités affichées sont celles des personnes présentes, chacune avec sa portion.</li>' +
      '<li>Synchronisation : comme l\'outil NHL, un dépôt GitHub privé à ton nom garde un fichier <code>equilibre/etat.json</code>. Chaque partie (foyer, semaine, prix, réglages) porte la date de sa dernière modification et la plus récente l\'emporte ; coches de courses et repas préparés se fusionnent un par un. Le jeton d\'accès reste dans le navigateur de chaque appareil : il n\'est ni exporté, ni envoyé dans le dépôt. Un dépôt public est refusé.</li></ul></div></div>';
    h += '<div class="section"><h2>Conventions de calcul</h2><div class="carte"><ul class="liste-simple">' +
